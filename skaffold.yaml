apiVersion: skaffold/v4beta1
kind: Config
metadata:
  name: whistler
build:
  artifacts:
    - image: whistler
      context: .
      docker:
        dockerfile: Dockerfile
    # The container-desktop trio (xfce-plain / gnome-plain / streamer-selkies2)
    # is not built here any more: desktops are VM-only and container sessions
    # are web-terminal only. The images and their Makefile targets still work
    # if you want to run the sidecar mechanism by hand — see
    # design/container_workloads.md.
    - image: whistler-storage-gateway
      context: images/storage-gateway
      docker:
        dockerfile: Dockerfile
deploy:
  helm:
    releases:
      - name: whistler
        chartPath: charts/whistler
        namespace: whistler
        createNamespace: true
        valuesFiles:
          - charts/whistler/values.yaml
          # Dev VM templates (containerDisk + CDI qcow2 import); needs KubeVirt
          # installed on the cluster or the sessions just fail policy/probe.
          - charts/whistler/values-dev-vm.yaml
        setValues:
          whistler.auth.allowAny: false
          # k3d/docker-desktop have no "kata" RuntimeClass, so coercing
          # privileged templates to kata would leave pods unschedulable.
          whistler.security.forceKataForPrivileged: false
          server.service.type: NodePort
          server.service.nodePort: 30022
          portal.auth.allowAny: true
          portal.auth.allowAdmin: true
          # Front both portal apps through the chart's bundled Traefik pod on one
          # origin instead of two NodePorts. host left empty -> path-only routing,
          # so it works regardless of the localhost:30080 the port-forward uses.
          portal.service.type: ClusterIP
          portal.ingress.enabled: true
          userVolume.accessMode: ReadWriteOnce
          userVolume.size: 10Mi
          whistler.volumes[0].name: data
          whistler.volumes[0].persistentVolumeClaim.claimName: whistler-data-pvc
          whistler.volumes[1].name: data2
          whistler.volumes[1].persistentVolumeClaim.claimName: whistler-data2-pvc
          # Seed the initial admin account for local dev.
          whistler.bootstrapAdmin.name: marma
          whistler.bootstrapAdmin.publicKeys[0]: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMNj07CelG2QAh7IogB+vlS4tRjuxOTr3mt0z3fX8jlX marma"
          # GPU types are discovered from the cluster (node gpu.product labels
          # + KubeVirt permittedHostDevices), so there is nothing to seed here.
          # To exercise the GPU-type picker UI on k3d without hardware, label
          # a node by hand:
          #   kubectl label node k3d-whistler-dev-server-0 \
          #     nvidia.com/gpu.product=dummy-gpu-small
          # (nothing schedules on it — the picker just gets an entry).
          # Sample zones for exercising the zone picker and per-zone
          # NetworkPolicies: green = internet-but-not-internal, red =
          # cluster-only DNS and no other egress. default stays deny-all+DNS.
          whistler.zones.green.egress.blockCIDRs[0]: 10.0.0.0/8
          whistler.zones.green.egress.blockCIDRs[1]: 172.16.0.0/12
          whistler.zones.green.egress.blockCIDRs[2]: 192.168.0.0/16
          whistler.zones.red.dns.clusterOnly: "true"
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_whistler}}"
          # tag@digest: the git-dirty tag alone doesn't change between edits,
          # so without the digest a rebuild would not roll the deployments.
          image.tag: "{{.IMAGE_TAG_whistler}}@{{.IMAGE_DIGEST_whistler}}"
          # The per-user NFS storage gateway (VM homes). tag@digest like the
          # main image: the git-dirty tag doesn't change between edits, so
          # without the digest a gateway rebuild wouldn't roll the operator-
          # created gateway Deployment and the node would serve a stale image
          # (e.g. one whose export still squashes to the wrong uid, or an old
          # Samba build, so the home mounts wrong or not at all).
          whistler.storageGateway.image: "{{.IMAGE_REPO_whistler_storage_gateway}}:{{.IMAGE_TAG_whistler_storage_gateway}}@{{.IMAGE_DIGEST_whistler_storage_gateway}}"
# Forward the front doors to localhost on `skaffold dev` (NodePorts aren't
# auto-published on kind the way they are on docker-desktop). The portal now goes
# through the chart's bundled Traefik proxy (whistler-portal-proxy :80): both
# portal apps share http://localhost:30080. SSH stays direct.
portForward:
  - resourceType: service
    resourceName: whistler-portal-proxy
    namespace: whistler
    port: 80
    localPort: 30080
  - resourceType: service
    resourceName: whistler-server
    namespace: whistler
    port: 8022
    localPort: 30022
