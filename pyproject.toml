[project]
name = "whistler"
version = "0.1.0"
description = "A TUI written in Python using Textual, served over SSH."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=6.6.0",
    "asyncssh>=2.14.0",
    "pyyaml>=6.0.1",
    "kopf>=1.37.0",
    "kubernetes>=29.0.0",
    "aiohttp>=3.9",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whistler"]
# Vendored portal assets (xterm.js flat files + the noVNC tree) are served by
# the portal; force-include them so they land in the wheel even though they are
# non-.py (and possibly untracked) assets.
artifacts = [
    "whistler/portal/static/*.js",
    "whistler/portal/static/novnc/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests need a cluster; they opt in via this marker and are
# deselected by default. Run them with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running Kubernetes cluster (k3d) and config env",
]
