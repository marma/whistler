{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal
spec:
  replicas: {{ .Values.portal.replicaCount }}
  selector:
    matchLabels:
      app: whistler-portal
  template:
    metadata:
      labels:
        app: whistler-portal
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-portal
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "whistler.portal"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORTAL_PORT
              value: "8080"
            - name: MANAGEMENT_PORT
              value: "8081"
            - name: WHISTLER_AUTH_ALLOW_ANY
              value: "{{ .Values.portal.auth.allowAny }}"
            - name: WHISTLER_AUTH_ALLOW_ADMIN
              value: "{{ .Values.portal.auth.allowAdmin }}"
            {{- if .Values.portal.auth.adminUsers }}
            - name: WHISTLER_ADMIN_USERS
              value: "{{ .Values.portal.auth.adminUsers }}"
            {{- end }}
            - name: WHISTLER_LOG_LEVEL
              value: "{{ .Values.portal.logLevel }}"
            - name: WHISTLER_FORCE_KATA_FOR_PRIVILEGED
              value: {{ .Values.whistler.security.forceKataForPrivileged | quote }}
            - name: WHISTLER_KATA_RUNTIME_CLASS
              value: {{ .Values.whistler.security.kataRuntimeClass | quote }}
            - name: WHISTLER_GPU_RUNTIME_CLASS
              value: {{ .Values.whistler.security.gpuRuntimeClass | quote }}
            # SSH addressing (design/proxyjump.md): the portal shows users the
            # `ssh <name>.w` one-liner and the @cert-authority line for their
            # known_hosts, so it needs the same suffix and CA the gateway uses.
            - name: WHISTLER_SSH_CA_SECRET_NAME
              value: "{{ .Release.Name }}-ssh-ca"
            - name: WHISTLER_SSH_DOMAIN_SUFFIX
              value: {{ .Values.whistler.ssh.domainSuffix | quote }}
            # Periodic desktop screenshots (whistler/portal/screenshots.py):
            # newest-only, in memory, one per session. interval <= 0 disables.
            - name: WHISTLER_SCREENSHOT_INTERVAL
              value: {{ .Values.portal.screenshots.intervalSeconds | quote }}
            - name: WHISTLER_SCREENSHOT_WIDTH
              value: {{ .Values.portal.screenshots.maxWidth | quote }}
            # The screenshot store is per-process; the loop warns if this is >1.
            - name: PORTAL_REPLICAS
              value: {{ .Values.portal.replicaCount | quote }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          # KubeConfigManager loads the zone/egress config, same as the
          # operator/server; users are read live via the K8s API (User CRs).
          volumeMounts:
            - name: config
              mountPath: "/etc/whistler-config/volumes.yaml"
              subPath: "volumes.yaml"
              readOnly: true
            {{- if .Values.whistler.networkPolicy }}
            # Legacy pre-zones egress config (seeds the default zone).
            - name: config
              mountPath: "/etc/whistler-config/networkpolicy.yaml"
              subPath: "networkpolicy.yaml"
              readOnly: true
            {{- end }}
            - name: config
              mountPath: "/etc/whistler-config/images.yaml"
              subPath: "images.yaml"
              readOnly: true
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
{{- end }}
