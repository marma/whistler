{{- if and .Values.portal.enabled .Values.portal.ingress.enabled }}
{{- /*
Traefik file-provider config for the bundled portal proxy (see portal-proxy.yaml
for the Deployment/Service and the routing rationale). Static config + dynamic
routers/services in one ConfigMap.
*/}}
{{- $host := .Values.portal.ingress.host }}
{{- /* The viewer app serves the desktop connect page (/connect), the
       reverse-proxied Selkies viewer (/desktop), the noVNC viewer for VM
       sessions (/vnc + /ws-vnc + its /static assets), the web terminal
       (/term + /term-status + /ws-term), the session thumbnails
       (/screenshot) and the kiosk surface (/kiosk).

       /screenshot belongs to the viewer app but was missing here, so behind
       this proxy it fell through to the management catch-all and 404'd —
       invisibly, because the dashboard hides a thumbnail that fails to load.
       The kiosk cards use the same URL, which is how it surfaced. */}}
{{- $viewerPaths := "PathPrefix(`/connect`) || PathPrefix(`/desktop`) || PathPrefix(`/launch`) || PathPrefix(`/status`) || PathPrefix(`/term`) || PathPrefix(`/ws-term`) || PathPrefix(`/vnc`) || PathPrefix(`/ws-vnc`) || PathPrefix(`/console`) || PathPrefix(`/ws-console`) || PathPrefix(`/screenshot`) || PathPrefix(`/kiosk`) || PathPrefix(`/static`)" }}
{{- $viewerRule := $viewerPaths }}
{{- $mgmtRule := "PathPrefix(`/`)" }}
{{- if $host }}
{{- $viewerRule = printf "Host(`%s`) && (%s)" $host $viewerPaths }}
{{- $mgmtRule = printf "Host(`%s`)" $host }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-portal-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal-proxy
data:
  traefik.yml: |
    entryPoints:
      web:
        address: ":80"
    providers:
      file:
        filename: /config/dynamic.yml
        # watch: false deliberately. The dynamic config is mounted with
        # subPath, and kubelet never updates a subPath ConfigMap mount in
        # place, so there is nothing for a watcher to see; config changes
        # reach the proxy by rolling the pod (checksum/config annotation in
        # portal-proxy.yaml). Watching only added a failure mode: inotify
        # instances are a per-uid host limit (fs.inotify.max_user_instances,
        # default 128) shared by every root container on the node, and when
        # it is exhausted the file provider dies at startup with "error
        # creating file watcher: too many open files" — leaving Traefik up
        # with ZERO routers, i.e. a 404 on every portal path while the portal
        # itself is perfectly healthy.
        watch: false
    log:
      level: {{ .Values.portal.logLevel | default "INFO" }}
  dynamic.yml: |
    http:
      routers:
        # Viewer paths win over the catch-all via higher priority.
        portal-viewer:
          rule: "{{ $viewerRule }}"
          priority: 100
          entryPoints: [web]
          service: portal-viewer
        portal-mgmt:
          rule: "{{ $mgmtRule }}"
          priority: 10
          entryPoints: [web]
          service: portal-mgmt
      services:
        portal-viewer:
          loadBalancer:
            servers:
              - url: "http://{{ .Release.Name }}-portal:{{ .Values.portal.service.port }}"
        portal-mgmt:
          loadBalancer:
            servers:
              - url: "http://{{ .Release.Name }}-portal:{{ .Values.portal.managementService.port }}"
{{- end }}
