apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator
rules:
  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs: [list, watch, patch, get]

  # Framework: runtime observation of the namespace & cluster.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch, create, get, update, patch, delete]

  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list, watch, create, get, update, patch, delete]

  # Application: watching & handling for the custom resources we declare.
  - apiGroups: [whistler.martinmalmsten.net]
    resources: [sessions, templates, sessions/status, users, zones, groups, datasets, homevolumes]
    verbs: [list, watch, patch, get, update, create, delete]

  # KubeVirt VM desktop backend. The CRDs may be absent in a given cluster;
  # the RBAC is harmless when the resource types do not exist.
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [create, delete, get, list, watch, patch, update]
  # The one thing a runStrategy patch cannot do: start a VM that is already
  # RerunOnFailure and stopped, which is what a guest that powered itself off
  # leaves behind (virt-controller only acts on a strategy that *changed*).
  # Same grant `virtctl start` needs; see _ensure_vm_start_requested. Still
  # operator-only — no other process gained a KubeVirt write.
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachines/start]
    verbs: [update]
  # GPU-type catalog (config.py get_gpu_catalog): node labels/allocatable
  # plus the KubeVirt CR's permittedHostDevices resolve a VM template's GPU
  # request to the per-type passthrough resource name at build time.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [kubevirt.io]
    resources: [kubevirts]
    verbs: [get, list]
  # CDI root-disk DataVolumes (imageURL boot source): the phase timer reads
  # them to surface the Importing phase. Created via the VM's
  # dataVolumeTemplates, so no create/delete needed here.
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get, list, watch]

  # Application: other resources it produces and manages.
  - apiGroups: [""]
    resources: [pods, pods/exec, persistentvolumeclaims, services, events, configmaps, secrets]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
rules:
  # The server needs to manage namespaces and network policies for user isolation
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list, watch]
  
  # delete: _ensure_user_namespace prunes per-zone policies whose zone was
  # removed from the catalog.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, watch, update, patch, delete]

  # Managing user pods and PVCs
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, persistentvolumeclaims]
    verbs: [create, delete, get, list, watch, patch]

  # Reading configuration
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list]

  # Managing custom resources
  - apiGroups: [whistler.martinmalmsten.net]
    resources: [sessions, templates, sessions/status, users, zones, groups, datasets, homevolumes]
    verbs: [create, delete, get, list, patch, update, watch]

  # KubeVirt VM sessions: READ ONLY, deliberately. get_user_instances checks a
  # VMI's deletionTimestamp to report a shutting-down guest as Terminating
  # (that 403 was swallowed by an `except ApiException`, so the only symptom
  # was a VM stuck on its old phase while it went down).
  #
  # No write verbs, and that is the point: both directions of start/stop are
  # annotation writes on the Session CR, and the operator's reconcile is what
  # touches the VirtualMachine. The gateway is the process that terminates
  # untrusted SSH, so it holds no KubeVirt write at all — see
  # design/proxyjump.md, "Stopping through the operator".
  #
  # Harmless when KubeVirt is not installed — the resource types simply do
  # not exist.
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-server-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-server-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-server-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-server
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-server
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-server
    namespace: {{ .Release.Namespace }}

{{- if .Values.portal.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-portal
rules:
  # Unified templates + sessions (desktop portal/Guacamole flow AND the
  # management UI's SSH template/instance CRUD + trigger) + users (admin user
  # management).
  - apiGroups: [whistler.martinmalmsten.net]
    resources: [sessions, templates, sessions/status, users, zones, groups, datasets, homevolumes]
    verbs: [get, list, create, update, patch, delete, watch]

  # add_desktop_session / _ensure_user_namespace.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create]
  # delete: _ensure_user_namespace prunes per-zone policies whose zone was
  # removed from the catalog.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]

  # stop_instance deletes the pod (keeps the CR); list pods for status.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]

  # Dashboard tab: node allocatable CPU/memory/GPU capacity. The KubeVirt CR's
  # permittedHostDevices tells the GPU catalog which allocatable resources are
  # passthrough GPUs (vs. e.g. the card's audio function).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [kubevirt.io]
    resources: [kubevirts]
    verbs: [get, list]

  # Web terminal: the portal shells out to `kubectl exec` into the session pod
  # (whistler.portal.terminal), so it needs the pods/exec subresource — same
  # grant the SSH server has for its interactive shells. The screenshot loop
  # (whistler.portal.screenshots) execs into the streamer sidecar the same way.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]

  # PVCs: list for volume management display.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]

  # KubeVirt VM sessions: read VMs/VMIs for status, and open the serial-console
  # / VNC subresource websockets for the web terminal and the noVNC viewer
  # (same grant virtctl console/vnc needs). Harmless when KubeVirt is not
  # installed.
  #
  # `patch` on virtualmachines used to be here for stop_instance flipping
  # runStrategy to Halted. Stopping is now an annotation on the Session CR
  # that the operator acts on, exactly like starting always was, so the last
  # KubeVirt write left this role with it — the only process that writes to
  # KubeVirt is the operator.
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [get, list, watch]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/console, virtualmachineinstances/vnc]
    verbs: [get]

  # Read services, configmaps and secrets cluster-wide (read-only — the portal
  # no longer needs write access now that users are CRs, not a Secret).
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-portal
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-portal
    namespace: {{ .Release.Namespace }}

---
# Writing Secrets is deliberately NOT in the ClusterRole above: it is scoped to
# this one namespace, and exists for exactly one thing — the bucket credential
# an admin types into the Datasets editor, which Whistler stores so a dataset
# can be defined without a kubectl round-trip.
#
# Narrow on purpose. RBAC cannot restrict `create` by name (and has no prefix
# matching), so this does allow the portal to write any Secret in the release
# namespace, the host CA and SSH host key included. It is a smaller step than
# it looks: the ClusterRole already grants get/list on Secrets cluster-wide, so
# the portal can already READ those. This adds integrity exposure in one
# namespace, not confidentiality. An admin who would rather not have it can
# delete this Role — the editor still works, it just requires naming a Secret
# you created yourself (design/storage.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-portal-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-portal-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-portal-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-portal
    namespace: {{ .Release.Namespace }}
{{- end }}
