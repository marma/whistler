apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator
rules:
  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs: [list, watch, patch, get]

  # Framework: runtime observation of the namespace & cluster.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch, create, get, update, patch, delete]

  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list, watch, create, get, update, patch, delete]

  # Application: watching & handling for the custom resources we declare.
  - apiGroups: [whistler.martinmalmsten.net]
    resources: [sessions, templates, sessions/status]
    verbs: [list, watch, patch, get, update, create, delete]

  # KubeVirt VM desktop backend. The CRDs may be absent in a given cluster;
  # the RBAC is harmless when the resource types do not exist.
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [create, delete, get, list, watch, patch, update]
  # CDI root-disk DataVolumes (imageURL boot source): the phase timer reads
  # them to surface the Importing phase. Created via the VM's
  # dataVolumeTemplates, so no create/delete needed here.
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get, list, watch]

  # Application: other resources it produces and manages.
  - apiGroups: [""]
    resources: [pods, pods/exec, persistentvolumeclaims, services, events, configmaps, secrets]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
rules:
  # The server needs to manage namespaces and network policies for user isolation
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list, watch]
  
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, watch, update, patch]

  # Managing user pods and PVCs
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, persistentvolumeclaims]
    verbs: [create, delete, get, list, watch, patch]

  # Reading configuration
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list]

  # Managing custom resources
  - apiGroups: [whistler.martinmalmsten.net]
    resources: [sessions, templates, sessions/status]
    verbs: [create, delete, get, list, patch, update, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-server-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-server-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-server-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-server
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-server
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-server
    namespace: {{ .Release.Namespace }}

{{- if .Values.portal.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-portal
rules:
  # Unified templates + sessions (desktop portal/Guacamole flow AND the
  # management UI's SSH template/instance CRUD + trigger).
  - apiGroups: [whistler.martinmalmsten.net]
    resources: [sessions, templates, sessions/status]
    verbs: [get, list, create, update, patch, delete, watch]

  # add_desktop_session / _ensure_user_namespace.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch]

  # stop_instance deletes the pod (keeps the CR); list pods for status.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]

  # Web terminal: the portal shells out to `kubectl exec` into the session pod
  # (whistler.portal.terminal), so it needs the pods/exec subresource — same
  # grant the SSH server has for its interactive shells.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]

  # PVCs: list for volume management display.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]

  # KubeVirt VM sessions: read VMs/VMIs for status, patch VMs so
  # stop_instance / reconnect can flip runStrategy (Halted/Always), and open
  # the serial-console / VNC subresource websockets for the web terminal and
  # the noVNC viewer (same grant virtctl console/vnc needs). Harmless when
  # KubeVirt is not installed.
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [get, list, watch, patch]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/console, virtualmachineinstances/vnc]
    verbs: [get]

  # Read services and configmaps cluster-wide; secrets are read-only here
  # (write access to the users Secret is granted by the namespaced Role below).
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-portal
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-portal
    namespace: {{ .Release.Namespace }}

---
# Namespaced role: allows the portal to update the users Secret so that
# admin user management (save_user / delete_user) can persist changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-portal-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-portal-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-portal-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-portal
    namespace: {{ .Release.Namespace }}
{{- end }}
