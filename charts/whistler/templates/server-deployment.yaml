apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app: whistler-server
  template:
    metadata:
      labels:
        app: whistler-server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-server
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "whistler.server", "--in-cluster"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER_VOLUME_ACCESS_MODE
              value: "{{ .Values.userVolume.accessMode }}"
            - name: USER_VOLUME_SIZE
              value: "{{ .Values.userVolume.size }}"
            - name: WHISTLER_AUTH_ALLOW_ANY
              value: "{{ .Values.whistler.auth.allowAny }}"
            - name: WHISTLER_LOG_LEVEL
              value: "{{ .Values.server.logLevel }}"
            - name: WHISTLER_HOST_KEY_SECRET_NAME
              value: "{{ .Release.Name }}-server-host-key"
            - name: WHISTLER_FORCE_KATA_FOR_PRIVILEGED
              value: {{ .Values.whistler.security.forceKataForPrivileged | quote }}
            - name: WHISTLER_KATA_RUNTIME_CLASS
              value: {{ .Values.whistler.security.kataRuntimeClass | quote }}
            - name: WHISTLER_GPU_RUNTIME_CLASS
              value: {{ .Values.whistler.security.gpuRuntimeClass | quote }}
          ports:
            - containerPort: 8022
              name: ssh
          volumeMounts:
            - name: selectors-config
              mountPath: "/etc/whistler-config/selectors.yaml"
              subPath: "selectors.yaml"
              readOnly: true
            - name: selectors-config
              mountPath: "/etc/whistler-config/volumes.yaml"
              subPath: "volumes.yaml"
              readOnly: true
            {{- if .Values.whistler.networkPolicy }}
            # Legacy pre-zones egress config (seeds the default zone).
            - name: selectors-config
              mountPath: "/etc/whistler-config/networkpolicy.yaml"
              subPath: "networkpolicy.yaml"
              readOnly: true
            {{- end }}
            - name: selectors-config
              mountPath: "/etc/whistler-config/images.yaml"
              subPath: "images.yaml"
              readOnly: true
            - name: selectors-config
              mountPath: "/etc/whistler-config/gpuTypes.yaml"
              subPath: "gpuTypes.yaml"
              readOnly: true

          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: selectors-config
          configMap:
            name: {{ .Release.Name }}-config
