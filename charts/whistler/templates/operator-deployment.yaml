apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app: whistler-operator
  template:
    metadata:
      labels:
        app: whistler-operator
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["kopf", "run", "whistler/operator.py", "--verbose"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER_VOLUME_ACCESS_MODE
              value: {{ .Values.userVolume.accessMode | quote }}
            - name: USER_VOLUME_SIZE
              value: {{ .Values.userVolume.size | quote }}
            - name: OPERATOR_LOG_LEVEL
              value: "{{ .Values.operator.logLevel }}"
            - name: WHISTLER_FORCE_KATA_FOR_PRIVILEGED
              value: {{ .Values.whistler.security.forceKataForPrivileged | quote }}
            - name: WHISTLER_KATA_RUNTIME_CLASS
              value: {{ .Values.whistler.security.kataRuntimeClass | quote }}
            - name: WHISTLER_GPU_RUNTIME_CLASS
              value: {{ .Values.whistler.security.gpuRuntimeClass | quote }}
            # SSH host CA + jump addressing (design/proxyjump.md). The
            # operator signs session host keys with the CA; the suffix goes
            # into the certificates as a principal, so it MUST match the
            # server's or clients fail to verify the name they dialled.
            - name: WHISTLER_SSH_CA_SECRET_NAME
              value: "{{ .Release.Name }}-ssh-ca"
            # The gateway's host key, named here so a backup taken in this pod
            # (python -m whistler.backup) can carry it (design/backup.md).
            - name: WHISTLER_HOST_KEY_SECRET_NAME
              value: "{{ .Release.Name }}-server-host-key"
            {{- if .Values.backup.enabled }}
            # The backup volume's claim, which the operator creates and
            # re-attaches (config.ensure_backup_claim); see values backup.volume.
            - name: WHISTLER_BACKUP_CLAIM
              value: "{{ .Release.Name }}-backups"
            - name: WHISTLER_BACKUP_VOLUME_NAME
              value: {{ .Values.backup.volume.existingVolumeName | quote }}
            - name: WHISTLER_BACKUP_STORAGE_CLASS
              value: {{ .Values.backup.volume.storageClassName | quote }}
            - name: WHISTLER_BACKUP_SIZE
              value: {{ .Values.backup.volume.size | quote }}
            - name: WHISTLER_BACKUP_ACCESS_MODE
              value: {{ .Values.backup.volume.accessMode | quote }}
            {{- end }}
            - name: WHISTLER_SSH_DOMAIN_SUFFIX
              value: {{ .Values.whistler.ssh.domainSuffix | quote }}
            - name: WHISTLER_STREAMER_IMAGE
              value: {{ .Values.whistler.streamer.image | quote }}
            - name: WHISTLER_STORAGE_GATEWAY_IMAGE
              value: {{ .Values.whistler.storageGateway.image | quote }}
            # Maps travel as JSON (parsed by KubeConfigManager._env_json).
            - name: WHISTLER_STORAGE_GATEWAY_NODE_SELECTOR
              value: {{ .Values.whistler.storageGateway.nodeSelector | toJson | quote }}
            - name: WHISTLER_STORAGE_GATEWAY_RESOURCES
              value: {{ .Values.whistler.storageGateway.resources | toJson | quote }}
            - name: WHISTLER_HOME_DISK_SIZE
              value: {{ .Values.whistler.homeDisk.size | quote }}
            # "" disables hugepages for VM guest RAM (whistler.hugePages).
            - name: WHISTLER_VM_HUGE_PAGE_SIZE
              value: {{ .Values.whistler.hugePages.pageSize | quote }}
            # Seconds a VM guest gets to shut down cleanly before the
            # domain is destroyed (whistler.vm.shutdownGraceSeconds).
            - name: WHISTLER_VM_SHUTDOWN_GRACE_SECONDS
              value: {{ .Values.whistler.vm.shutdownGraceSeconds | quote }}
            - name: WHISTLER_S3_PROXY_IMAGE
              value: {{ .Values.whistler.s3Proxy.image | quote }}
            - name: WHISTLER_S3_PROXY_RESOURCES
              value: {{ .Values.whistler.s3Proxy.resources | toJson | quote }}
            - name: WHISTLER_DATASET_SERVER_IMAGE
              value: {{ .Values.whistler.datasetServer.image | quote }}
            - name: WHISTLER_DATASET_SERVER_RESOURCES
              value: {{ .Values.whistler.datasetServer.resources | toJson | quote }}
            - name: WHISTLER_DATASET_STORAGE_CLASS
              value: {{ .Values.whistler.datasetServer.storageClass | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          # ensure_pod() runs here now, so the operator needs the same user and
          # zone/egress configuration the server has (securityContext, zones).
          volumeMounts:
            - name: config
              mountPath: "/etc/whistler-config/volumes.yaml"
              subPath: "volumes.yaml"
              readOnly: true
            {{- if .Values.whistler.networkPolicy }}
            # Legacy pre-zones egress config (seeds the default zone).
            - name: config
              mountPath: "/etc/whistler-config/networkpolicy.yaml"
              subPath: "networkpolicy.yaml"
              readOnly: true
            {{- end }}
            - name: config
              mountPath: "/etc/whistler-config/images.yaml"
              subPath: "images.yaml"
              readOnly: true
            # Only the operator seeds the bootstrap admin (ensure_bootstrap_admin,
            # called once at startup) — server/portal don't need this file.
            - name: config
              mountPath: "/etc/whistler-config/bootstrapAdmin.yaml"
              subPath: "bootstrapAdmin.yaml"
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config

