apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app: whistler-operator
  template:
    metadata:
      labels:
        app: whistler-operator
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/users: {{ include (print $.Template.BasePath "/users-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["kopf", "run", "whistler/operator.py", "--verbose"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER_VOLUME_ACCESS_MODE
              value: {{ .Values.userVolume.accessMode | quote }}
            - name: USER_VOLUME_SIZE
              value: {{ .Values.userVolume.size | quote }}
            - name: OPERATOR_LOG_LEVEL
              value: "{{ .Values.operator.logLevel }}"
            - name: WHISTLER_FORCE_KATA_FOR_PRIVILEGED
              value: {{ .Values.whistler.security.forceKataForPrivileged | quote }}
            - name: WHISTLER_KATA_RUNTIME_CLASS
              value: {{ .Values.whistler.security.kataRuntimeClass | quote }}
            - name: WHISTLER_STREAMER_IMAGE
              value: {{ .Values.whistler.streamer.image | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          # ensure_pod() runs here now, so the operator needs the same user and
          # network-policy configuration the server has (securityContext, egress).
          volumeMounts:
            - name: users-config
              mountPath: "/etc/whistler"
              readOnly: true
            - name: config
              mountPath: "/etc/whistler-config/volumes.yaml"
              subPath: "volumes.yaml"
              readOnly: true
            - name: config
              mountPath: "/etc/whistler-config/networkpolicy.yaml"
              subPath: "networkpolicy.yaml"
              readOnly: true
            - name: config
              mountPath: "/etc/whistler-config/images.yaml"
              subPath: "images.yaml"
              readOnly: true
      volumes:
        - name: users-config
          secret:
            secretName: {{ .Release.Name }}-users
        - name: config
          configMap:
            name: {{ .Release.Name }}-config

