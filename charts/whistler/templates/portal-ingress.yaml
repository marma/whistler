{{- if and .Values.portal.enabled .Values.portal.ingress.resource.enabled }}
{{- /*
A real cluster Ingress in front of the portal.

This is NOT the same thing as portal.ingress.enabled, which ships the bundled
Traefik *pod* (portal-proxy.yaml) that collapses the viewer (:8080) and
management (:8081) apps onto one origin using the file provider — no cluster
ingress controller involved. This object is the other half: it hands a
hostname on the cluster's own ingress controller to that single origin.

Backend selection:
  * bundled proxy enabled  -> route to <release>-portal-proxy:80, which already
    knows the viewer/mgmt path split. One rule, one path, and the split stays
    in exactly one place.
  * bundled proxy disabled -> route to the viewer service and let the
    management app keep its own NodePort. A cluster Ingress cannot reproduce
    the proxy's path table without duplicating it here.
*/}}
{{- $proxy := .Values.portal.ingress }}
{{- $ing := $proxy.resource }}
{{- $backendName := printf "%s-portal" .Release.Name }}
{{- $backendPort := .Values.portal.service.port | int }}
{{- if $proxy.enabled }}
{{- $backendName = printf "%s-portal-proxy" .Release.Name }}
{{- $backendPort = $proxy.service.port | int }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{ if $ing.host }}host: {{ $ing.host | quote }}
      {{ end }}http:
        paths:
          - path: {{ $ing.path | default "/" }}
            pathType: {{ $ing.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: {{ $backendPort }}
{{- end }}
