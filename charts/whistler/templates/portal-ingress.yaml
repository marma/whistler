{{- if and .Values.portal.enabled .Values.portal.ingress.enabled }}
{{- include "whistler.portal.validate" . }}
{{- /*
A Kubernetes Ingress on the cluster's own ingress controller, handing a
hostname to the portal.

The backend is always the bundled proxy service (portal-proxy.yaml), which
already owns the viewer/management path split — one rule, one path, and the
split stays in exactly one place. That is also why enabling this turns the
proxy on: routing straight at the portal Service would reach one app and
strand the other, and reproducing the path table in Ingress rules would be a
second copy of it to keep in sync.
*/}}
{{- $ing := .Values.portal.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{ if $ing.host }}host: {{ $ing.host | quote }}
      {{ end }}http:
        paths:
          - path: {{ $ing.path | default "/" }}
            pathType: {{ $ing.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Release.Name }}-portal-proxy
                port:
                  number: {{ .Values.portal.proxy.service.port | int }}
{{- end }}
