{{- if .Values.portal.enabled }}
{{- include "whistler.portal.validate" . }}
{{- /*
One Service, two ports: the viewer app on 8080 and the management app on 8081
(both from the same pod, see portal-deployment.yaml). Node ports are only
emitted for type NodePort, and only when pinned — empty lets Kubernetes pick a
free one instead of the chart claiming a fixed number on every cluster it
lands on.
*/}}
{{- $svc := .Values.portal.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal
spec:
  type: {{ $svc.type }}
  selector:
    app: whistler-portal
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: 8080
      {{- if and (eq $svc.type "NodePort") $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
    - name: management
      port: {{ $svc.managementPort }}
      targetPort: 8081
      {{- if and (eq $svc.type "NodePort") $svc.managementNodePort }}
      nodePort: {{ $svc.managementNodePort }}
      {{- end }}
{{- end }}
