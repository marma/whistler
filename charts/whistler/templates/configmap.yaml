apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-server
data:
  selectors.yaml: |
{{ toYaml .Values.whistler.node_selectors | indent 4 }}
  volumes.yaml: |
{{ toYaml .Values.whistler.volumes | indent 4 }}
  networkpolicy.yaml: |
{{ toYaml .Values.whistler.networkPolicy | indent 4 }}
  images.yaml: |
{{ toYaml .Values.whistler.availableImages | indent 4 }}

