apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-server
data:
  selectors.yaml: |
{{ toYaml .Values.whistler.node_selectors | indent 4 }}
  volumes.yaml: |
{{ toYaml .Values.whistler.volumes | indent 4 }}
{{- if .Values.whistler.networkPolicy }}
  # Legacy pre-zones egress config; read as the default zone when
  # zones.default is absent (whistler/config.py _load_zones).
  networkpolicy.yaml: |
{{ toYaml .Values.whistler.networkPolicy | indent 4 }}
{{- end }}
  images.yaml: |
{{ toYaml .Values.whistler.images | indent 4 }}
  gpuTypes.yaml: |
{{ toYaml .Values.whistler.gpuTypes | indent 4 }}
  bootstrapAdmin.yaml: |
{{ toYaml .Values.whistler.bootstrapAdmin | indent 4 }}

