{{- range $name, $template := .Values.templates }}
apiVersion: whistler.martinmalmsten.net/v1
kind: Template
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  user: system
  mode: {{ $template.mode | default "ssh" }}
  runtime: {{ $template.runtime | default "container" }}
  description: {{ $template.description | default "" | quote }}
{{- if $template.image }}
  image: {{ $template.image }}
{{- end }}
{{- if $template.imageURL }}
  imageURL: {{ $template.imageURL | quote }}
{{- end }}
{{- if $template.rootDiskSize }}
  rootDiskSize: {{ $template.rootDiskSize | quote }}
{{- end }}
{{- if $template.viewer }}
  viewer: {{ $template.viewer }}
{{- end }}
{{- if $template.displayPort }}
  displayPort: {{ $template.displayPort }}
{{- end }}
{{- if $template.streamerImage }}
  streamerImage: {{ $template.streamerImage | quote }}
{{- end }}
{{- if $template.streamerEnv }}
  streamerEnv:
{{- range $k, $v := $template.streamerEnv }}
    {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if $template.fuse }}
  fuse: {{ $template.fuse }}
{{- end }}
{{- if $template.privileged }}
  privileged: {{ $template.privileged }}
{{- end }}
{{- if $template.persistence }}
  persistence: {{ $template.persistence }}
{{- end }}
{{- if $template.instancetype }}
  instancetype: {{ $template.instancetype | quote }}
{{- end }}
{{- if $template.resources }}
  resources:
{{ toYaml $template.resources | indent 4 }}
{{- end }}
{{- if $template.nodeSelector }}
  nodeSelector:
{{ toYaml $template.nodeSelector | indent 4 }}
{{- end }}
{{- if $template.personalMountPath }}
  personalMountPath: {{ $template.personalMountPath | quote }}
{{- end }}
---
{{- end }}
