{{- if .Values.coturn.enabled }}
{{- /*
  Shared static-auth-secret for coturn's use-auth-secret (REST) scheme. All
  three parties must agree on it: coturn (validates), the in-pod Selkies server
  (the operator injects it as SELKIES_TURN_SHARED_SECRET), and the portal (mints
  time-limited creds for the browser at /ice). Resolve order: explicit value ->
  existing secret (so upgrades don't rotate it) -> freshly generated.
*/ -}}
{{- $name := printf "%s-coturn" .Release.Name -}}
{{- $secret := .Values.coturn.staticAuthSecret -}}
{{- if not $secret -}}
{{-   $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{-   if and $existing $existing.data (index $existing.data "static-auth-secret") -}}
{{-     $secret = index $existing.data "static-auth-secret" | b64dec -}}
{{-   else -}}
{{-     $secret = randAlphaNum 40 -}}
{{-   end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-coturn
type: Opaque
stringData:
  static-auth-secret: {{ $secret | quote }}
{{- end }}
