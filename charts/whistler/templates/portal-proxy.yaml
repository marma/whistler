{{- if and .Values.portal.enabled (include "whistler.portal.proxyEnabled" .) }}
{{- /*
Bundled Traefik reverse proxy fronting the portal pod's two web apps on one
origin (see portal-deployment.yaml / whistler/portal/__main__.py):
  * viewer  (:8080) — desktop viewer + web terminal: /connect, /desktop, /launch, /status, /term, /ws-term, /static
  * mgmt    (:8081) — admin + user UI: /, /instances, /admin, /static
Route sets are disjoint except /static (both serve the SAME dir, so either
backend works — it falls to mgmt) and /healthz (probes hit the pod directly).
Collapsing onto one host lets WHISTLER_DESKTOP_PORTAL_URL stay empty so the
management UI's "Connect" link resolves same-origin.

Turned on by portal.ingress.enabled (it is the Ingress backend) or directly
by portal.proxy.enabled for a port-forwarded dev origin.

Uses Traefik's FILE provider (portal-proxy-config.yaml) rather than the
Kubernetes provider, so it needs no CRDs, no RBAC, and no cluster-installed
ingress controller — works on a vanilla Kind cluster.
*/}}
{{- $proxy := .Values.portal.proxy }}
{{- $auth := $proxy.basicAuth | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whistler-portal-proxy
  template:
    metadata:
      labels:
        app: whistler-portal-proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/portal-proxy-config.yaml") . | sha256sum }}
        {{- if $auth.enabled }}
        checksum/auth: {{ include (print $.Template.BasePath "/portal-proxy-auth.yaml") . | sha256sum }}
        {{- end }}
    spec:
      containers:
        - name: traefik
          image: {{ $proxy.image }}
          # Static config lives at Traefik's default path; dynamic config is
          # loaded (and watched) by the file provider in portal-proxy-config.yaml.
          ports:
            - containerPort: 80
              name: web
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/traefik/traefik.yml
              subPath: traefik.yml
              readOnly: true
            - name: config
              mountPath: /config/dynamic.yml
              subPath: dynamic.yml
              readOnly: true
            {{- if $auth.enabled }}
            - name: auth
              mountPath: /auth
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $proxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-portal-proxy
        {{- if $auth.enabled }}
        - name: auth
          secret:
            secretName: {{ .Release.Name }}-portal-proxy-auth
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: whistler-portal-proxy
spec:
  type: {{ $proxy.service.type }}
  selector:
    app: whistler-portal-proxy
  ports:
    - name: web
      port: {{ $proxy.service.port }}
      targetPort: 80
      {{- if and (eq $proxy.service.type "NodePort") $proxy.service.nodePort }}
      nodePort: {{ $proxy.service.nodePort }}
      {{- end }}
{{- end }}
