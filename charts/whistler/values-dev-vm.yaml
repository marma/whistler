# Dev-only overlay (wired into skaffold.yaml valuesFiles): two KubeVirt VM
# templates on top of the base values. Needs KubeVirt on the cluster
# (scripts/install_kubevirt.sh — the metal/multipass create scripts run it);
# on nodes without /dev/kvm set KUBEVIRT_USE_EMULATION=1.
#
# Helm merges maps but REPLACES lists, so whistler.images.vm here must carry
# every allowed VM boot source, not just additions.
whistler:
  images:
    vm:
      - quay.io/containerdisks/ubuntu:24.04
      - https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
      # Baked desktop VMs (in-guest Selkies) — build & push with
      # `make vm-desktop-image PUSH=1` / `make vm-gnome-desktop-image PUSH=1`
      # (+ CUDA=1 for the -cuda image); not skaffold artifacts because the qcow2
      # bake needs qemu/KVM. Every tag a template references must be listed here
      # or ensure_session fails closed with a PolicyError.
      # `:latest` is deliberate for these mutable dev images: it is the only tag
      # KubeVirt defaults to imagePullPolicy Always, so a rebuild is actually
      # re-pulled instead of booting the node's stale cached qcow2. The CUDA
      # variant is a separate image NAME for the same reason (`:latest-cuda`
      # would not match). See desktops/vm-xfce-selkies/build.sh.
      - localhost:5000/whistler-vm-xfce-selkies:latest
      - localhost:5000/whistler-vm-xfce-selkies-cuda:latest
      - localhost:5000/whistler-vm-gnome-selkies:latest
      - localhost:5000/whistler-vm-gnome-selkies-cuda:latest
      # Dev-server VMs (no desktop, SSH only) — `make devbase-image
      # [VARIANT=cuda|cuda-dev] PUSH=1`; see images/devbase/README.md.
      - localhost:5000/whistler-devbase:latest
      - localhost:5000/whistler-devbase-cuda:latest
      - localhost:5000/whistler-devbase-cuda-dev:latest

templates:
  # containerDisk boot: the qcow2 ships inside an OCI image. Fast pull-and-boot,
  # ephemeral root (home persists on the user PVC via the NFS storage gateway).
  ubuntu-vm:
    description: "Ubuntu 24.04 VM (containerDisk, noVNC)"
    mode: desktop
    runtime: vm
    image: "quay.io/containerdisks/ubuntu:24.04"
    viewer: vnc
    persistence: ephemeral
    resources:
      cpu: "2"
      memory: 2Gi

  # CDI boot: the same cloud image imported from its qcow2 URL into a
  # per-session root-disk PVC (persistent root; first boot waits on the
  # import — the session shows phase Importing). Requires CDI, which
  # install_kubevirt.sh installs by default. Note: this is a *disk image*
  # import, not an installer-ISO flow — the guest must ship cloud-init.
  ubuntu-vm-cdi:
    description: "Ubuntu 24.04 VM (CDI-imported root disk, noVNC)"
    mode: desktop
    runtime: vm
    imageURL: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
    rootDiskSize: 10Gi
    viewer: vnc
    persistence: persistent
    resources:
      cpu: "2"
      memory: 2Gi

  # ubuntu-vm + a real desktop: XFCE and the Selkies 2.x stack are baked into
  # the containerDisk (desktops/vm-xfce-selkies — the sidecar can't reach into
  # a VM, so the streamer lives in the guest as whistler-streamer.service).
  # viewer: websockets makes the portal reverse-proxy the guest's Selkies on
  # displayPort, exactly like a pod desktop: per-session Service -> launcher
  # pod -> masquerade -> guest. The VNC subresource console stays available
  # as a rescue path (shows the text console, not the desktop).
  #
  # Four VM-desktop templates below, two DEs x {lean, CUDA}. The `-cuda`
  # variants use the separate -cuda image (built with CUDA=1 — bakes the NVIDIA
  # open driver) and request the RTX 4090 via nodeSelector + resources.gpu; the
  # lean ones use the driver-free image and run anywhere. Build all four with:
  #   make vm-desktop-image        make vm-desktop-image CUDA=1
  #   make vm-gnome-desktop-image  make vm-gnome-desktop-image CUDA=1

  # XFCE, lean (no GPU) — runs on any node.
  ubuntu-vm-selkies:
    description: "Ubuntu 26.04 VM + XFCE (containerDisk, Selkies)"
    mode: desktop
    runtime: vm
    image: "localhost:5000/whistler-vm-xfce-selkies:latest"
    viewer: websockets
    persistence: ephemeral
    displayPort: 8082
    resources:
      cpu: "4"
      memory: 6Gi

  # XFCE, CUDA (RTX 4090 passthrough) — k3s-metal only.
  ubuntu-vm-selkies-cuda:
    description: "Ubuntu 26.04 VM + XFCE + RTX 4090 (containerDisk, Selkies)"
    mode: desktop
    runtime: vm
    image: "localhost:5000/whistler-vm-xfce-selkies-cuda:latest"
    viewer: websockets
    persistence: ephemeral
    displayPort: 8082
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4090
    resources:
      cpu: "4"
      memory: 8Gi
      gpu: "1"

  # Same VM/Selkies arrangement, but the *real GNOME Shell* (46, X11 backend)
  # instead of XFCE — baked into desktops/vm-gnome-selkies on a 24.04 guest
  # (GNOME 46 is the last Shell with an X11 backend; see that image's README).
  # streamerEnv pins H264 streaming mode ON: mutter is a GL compositor and emits
  # no damage for static content, so without it static windows render black on
  # the client. GNOME on llvmpipe is heavier than XFCE, hence the memory floor.

  # GNOME, lean (no GPU) — runs on any node.
  ubuntu-vm-gnome-selkies:
    description: "Ubuntu 24.04 VM + GNOME Shell (containerDisk, Selkies)"
    mode: desktop
    runtime: vm
    image: "localhost:5000/whistler-vm-gnome-selkies:latest"
    viewer: websockets
    persistence: ephemeral
    displayPort: 8082
    streamerEnv:
      SELKIES_H264_STREAMING_MODE: "true"
    resources:
      cpu: "4"
      memory: 6Gi

  # GNOME, CUDA (RTX 4090 passthrough) — k3s-metal only.
  ubuntu-vm-gnome-selkies-cuda:
    description: "Ubuntu 24.04 VM + GNOME Shell + RTX 4090 (containerDisk, Selkies)"
    mode: desktop
    runtime: vm
    image: "localhost:5000/whistler-vm-gnome-selkies-cuda:latest"
    viewer: websockets
    persistence: ephemeral
    displayPort: 8082
    streamerEnv:
      SELKIES_H264_STREAMING_MODE: "true"
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4090
    resources:
      cpu: "4"
      memory: 8Gi
      gpu: "1"

  # --- devbase: development server VMs, no desktop --------------------------
  # mode: ssh + runtime: vm — the guest is a plain SSH host (cloud-init creates
  # the user, installs their keys, NFS-mounts the home), reached through the
  # gateway's jump host as `ssh <session>.w`. No viewer, no streamer, no
  # screenshots; the KubeVirt serial console and the portal's web terminal
  # remain as rescue paths.
  #
  # persistence: persistent, unlike the desktop templates above: an ephemeral
  # session is torn down on disconnect, which is wrong for a box someone leaves
  # a build or a tmux running on.
  #
  # Toolchain: clang 21, Python 3.14, pixi (+ cmake/ninja/git/editors). Three
  # variants — see images/devbase/README.md for what "CUDA available" means in
  # each. Build: `make devbase-image [VARIANT=cuda|cuda-dev] PUSH=1`.
  devbase:
    description: "Ubuntu 26.04 dev server (SSH; clang, Python 3.14, pixi)"
    mode: ssh
    runtime: vm
    image: "localhost:5000/whistler-devbase:latest"
    persistence: persistent
    resources:
      cpu: "4"
      memory: 8Gi

  # + the NVIDIA driver, i.e. the GPU runtime (libcuda, PTX JIT, NVENC,
  # nvidia-smi) — what PyTorch/JAX wheels load. No nvcc. k3s-metal only.
  devbase-cuda:
    description: "Ubuntu 26.04 dev server + RTX 4090 runtime (SSH; no nvcc)"
    mode: ssh
    runtime: vm
    image: "localhost:5000/whistler-devbase-cuda:latest"
    persistence: persistent
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4090
    resources:
      cpu: "4"
      memory: 16Gi
      gpu: "1"

  # + the CUDA SDK (nvcc, headers, dev libraries, cuda-gdb/compute-sanitizer)
  # for compiling CUDA C++ in-guest. k3s-metal only.
  devbase-cuda-dev:
    description: "Ubuntu 26.04 dev server + RTX 4090 + CUDA SDK (SSH; nvcc)"
    mode: ssh
    runtime: vm
    image: "localhost:5000/whistler-devbase-cuda-dev:latest"
    persistence: persistent
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4090
    resources:
      cpu: "8"
      memory: 16Gi
      gpu: "1"

  # GPU passthrough smoke test (k3s-metal only): requests the RTX 4090 via
  # KubeVirt's domain.devices.gpus (see whistler.security.gpuVmResourceName).
  # nodeSelector pins it to a node labeled with this GPU product, same as the
  # pod-mode path — moot on the single-node dev cluster but keeps the
  # template honest about what it actually needs.
  ubuntu-vm-gpu:
    description: "Ubuntu 24.04 VM + RTX 4090 passthrough (containerDisk, noVNC)"
    mode: desktop
    runtime: vm
    image: "quay.io/containerdisks/ubuntu:24.04"
    viewer: vnc
    persistence: ephemeral
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GeForce-RTX-4090
    resources:
      cpu: "4"
      memory: 8Gi
      gpu: "1"
