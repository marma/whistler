# Dev-only overlay (wired into skaffold.yaml valuesFiles): two KubeVirt VM
# templates on top of the base values. Needs KubeVirt on the cluster
# (scripts/install_kubevirt.sh — the metal/multipass create scripts run it);
# on nodes without /dev/kvm set KUBEVIRT_USE_EMULATION=1.
#
# Helm merges maps but REPLACES lists, so whistler.images.vm here must carry
# every allowed VM boot source, not just additions.
whistler:
  images:
    vm:
      # Baked desktop VMs (in-guest Selkies) — build & push both variants with
      # `make vm-gnome-desktop-image PUSH=1`; not skaffold artifacts because
      # the qcow2 bake needs qemu/KVM. Every tag a template references must be
      # listed here or ensure_session fails closed with a PolicyError.
      # Templates name the lean image only: a VM with a GPU boots
      # <image>-cuda instead, and only if that is listed here — unlisted, it
      # boots the lean image without the NVIDIA driver.
      # `:latest` is deliberate for these mutable dev images: it is the only tag
      # KubeVirt defaults to imagePullPolicy Always, so a rebuild is actually
      # re-pulled instead of booting the node's stale cached qcow2. The CUDA
      # variant is a separate image NAME for the same reason (`:latest-cuda`
      # would not match). See desktops/vm-gnome-selkies/build.sh.
      - localhost:5000/whistler-vm-gnome-selkies:latest
      - localhost:5000/whistler-vm-gnome-selkies-cuda:latest
      # Dev-server VMs (no desktop, SSH only) — `make devbase-image PUSH=1`
      # bakes base + cuda; see images/devbase/README.md.
      - localhost:5000/whistler-devbase:latest
      - localhost:5000/whistler-devbase-cuda:latest

templates:
  # containerDisk boot: the qcow2 ships inside an OCI image. Fast pull-and-boot,
  # ephemeral root (home persists on the user PVC via the NFS storage gateway).
  # GNOME, no GPU by default — runs on any node. One template for both: given
  # a GPU (instance overrides or the start dialog; k3s-metal only) it boots
  # whistler-vm-gnome-selkies-cuda instead, which has the NVIDIA driver.
  vm-desktop:
    description: "Ubuntu 24.04 VM + GNOME (GPU optional)"
    mode: desktop
    runtime: vm
    image: "localhost:5000/whistler-vm-gnome-selkies:latest"
    viewer: websockets
    persistence: persistent
    displayPort: 8082
    streamerEnv:
      SELKIES_VIDEO_STREAMING_MODE: "true"
    resources:
      cpu: "4"
      memory: 8Gi

  # --- devbase: development server VMs, no desktop --------------------------
  # mode: ssh + runtime: vm — the guest is a plain SSH host (cloud-init creates
  # the user, installs their keys, NFS-mounts the home), reached through the
  # gateway's jump host as `ssh <session>.w`. No viewer, no streamer, no
  # screenshots; the KubeVirt serial console and the portal's web terminal
  # remain as rescue paths.
  #
  # persistence: persistent, unlike the desktop templates above: an ephemeral
  # session is torn down on disconnect, which is wrong for a box someone leaves
  # a build or a tmux running on.
  #
  # Toolchain: clang 21, Python 3.14, pixi (+ cmake/ninja/git/editors). Two
  # image variants — see images/devbase/README.md for what "CUDA available"
  # means. Build: `make devbase-image PUSH=1` (base + cuda).
  #
  # No GPU by default. Given one (instance overrides or the start dialog;
  # k3s-metal only) it boots whistler-devbase-cuda instead: the NVIDIA driver,
  # i.e. the GPU runtime (libcuda, PTX JIT, NVENC, nvidia-smi) that
  # PyTorch/JAX wheels load. No nvcc: a user who wants the CUDA SDK installs
  # it themselves, e.g. with pixi (images/devbase/README.md).
  devbase:
    description: "Ubuntu 26.04 dev vm (GPU optional)"
    mode: ssh
    runtime: vm
    image: "localhost:5000/whistler-devbase:latest"
    persistence: persistent
    resources:
      cpu: "4"
      memory: 8Gi
