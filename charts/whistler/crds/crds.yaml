apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: templates.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                user:
                  type: string
                mode:
                  type: string
                  enum: ["ssh", "desktop"]
                  default: ssh
                  description: >-
                    Access type. "ssh" templates are reached over SSH (TUI or
                    direct shell); "desktop" templates expose a display server
                    consumed by the web portal via guacamole.
                runtime:
                  type: string
                  enum: ["container", "kata", "vm"]
                  default: container
                  description: >-
                    Execution backend. "container" is a plain pod; "kata" is a
                    pod pinned to the Kata RuntimeClass (lightweight VM isolation);
                    "vm" is a full KubeVirt VirtualMachine. Replaces the old
                    backend + runtimeClassName fields. The Kata RuntimeClass name
                    is operator-configured, not set here.
                image:
                  type: string
                imageURL:
                  type: string
                  description: >-
                    VM-only. HTTP(S) URL of a qcow2/raw disk image imported by CDI
                    into a per-session root-disk PVC (via dataVolumeTemplates).
                    Mutually exclusive with image. Subject to the whistler.images.vm
                    allow-list; the image must ship cloud-init and a serial getty.
                rootDiskSize:
                  type: string
                  default: "20Gi"
                  description: >-
                    VM-only. Size of the CDI-imported root disk PVC (only used with
                    imageURL; containerDisk roots are ephemeral and unsized).
                displayName:
                  type: string
                description:
                  type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: string
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                volumes:
                  type: object
                  additionalProperties:
                    type: string
                personalMountPath:
                  type: string
                privileged:
                  type: boolean
                  description: >-
                    Run the container with securityContext.privileged=true.
                    Required for images that run systemd as PID 1 (e.g. gnome-grd).
                    In production this can force the Kata runtime (see operator
                    config whistler.security.forceKataForPrivileged).
                fuse:
                  type: boolean
                  description: >-
                    Grant the container access to /dev/fuse. Required by images
                    whose display server mounts a FUSE filesystem (e.g.
                    gnome-remote-desktop's clipboard). Implemented today by running
                    the container privileged.
                displayPort:
                  type: integer
                  default: 8082
                  description: >-
                    Desktop-only. Port the streamer sidecar's Selkies (websockets
                    viewer) HTTP/WebSocket server listens on; the portal
                    reverse-proxies it (ignored for ssh). Defaults to 8082.
                viewer:
                  type: string
                  enum: ["websockets", "vnc"]
                  description: >-
                    Desktop-only. Display backend the portal uses. "websockets"
                    reverse-proxies the browser to a Selkies 2.x (pixelflux)
                    server on displayPort — the streamer sidecar for pods, or a
                    guest-run Selkies for VMs. "vnc" serves the portal's vendored
                    noVNC client over the KubeVirt VNC subresource (VM-only;
                    works for any guest, no agent needed). Default is computed by
                    the operator: "vnc" for runtime=vm, "websockets" otherwise.
                streamerImage:
                  type: string
                  description: >-
                    Desktop-only. Override the streamer sidecar image (the native
                    init sidecar owning Xvfb + PulseAudio + Selkies that every
                    desktop pod gets); defaults to the operator-configured
                    WHISTLER_STREAMER_IMAGE (whistler.streamer.image).
                streamerEnv:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Desktop-only. Extra env vars for the streamer sidecar, for
                    workload-dependent streaming knobs the sidecar cannot infer —
                    e.g. SELKIES_H264_STREAMING_MODE: "true" (required for GL
                    compositors like GNOME Shell) or SELKIES_RESOLUTION. For
                    runtime=vm + viewer=websockets these reach the guest's
                    baked-in streamer instead, written by cloud-init to
                    /etc/whistler/streamer.env.
                instancetype:
                  type: string
                  description: VM-only. KubeVirt instancetype name (e.g. "u1.medium").
                persistence:
                  type: string
                  enum: ["ephemeral", "persistent", "preemptible"]
                  default: ephemeral
                zone:
                  type: string
                  description: >-
                    Network zone (whistler.zones) sessions from this template
                    run under; omitted means "default". Must name a defined
                    zone — an unknown zone fails the session closed rather
                    than falling back. Applied as a pod label at build time,
                    so a zone change takes effect on the next session
                    start/reboot, never live.
  scope: Namespaced
  names:
    plural: templates
    singular: template
    kind: Template
    shortNames:
    - tpl

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                templateRef:
                  type: string
                user:
                  type: string
                preemptible:
                  type: boolean
                overrides:
                  type: object
                  description: >-
                    Per-session requests to deviate from the template's baked
                    values. Each field is honored only if the owning user's
                    User CR `overrides` grants that group; requesting an
                    ungranted field is a hard PolicyError (see
                    KubeConfigManager._apply_overrides). gpuType and volumes
                    are additionally checked against allowedGpuTypes /
                    allowedVolumes, same as a template-baked value.
                  properties:
                    resources:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    gpuType:
                      type: string
                    gpuCount:
                      type: integer
                    uid:
                      type: integer
                    gid:
                      type: integer
                    securityContext:
                      type: object
                      properties:
                        fsGroup:
                          type: integer
                        runAsUser:
                          type: integer
                        runAsGroup:
                          type: integer
                    volumes:
                      type: object
                      additionalProperties:
                        type: string
                    zone:
                      type: string
                      description: >-
                        Network zone override (requires the "zone" grant;
                        further gated by the user's allowedZones). Takes
                        effect on the next session start/reboot.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: >-
                    Session lifecycle phase. Pending/Provisioning/Booting/Ready/
                    Failed/Terminating for all runtimes; VM sessions additionally
                    use Importing (CDI is pulling the root disk image) and
                    Stopped (the VirtualMachine exists but is halted).
                mode:
                  type: string
                  description: Denormalized from the referenced template.
                runtime:
                  type: string
                  description: >-
                    The coerced runtime actually built (container/kata/vm). Used by
                    the operator probe/delete logic so it need not re-resolve the
                    template.
                podName:
                  type: string
                vmiName:
                  type: string
                address:
                  type: string
                displayPort:
                  type: integer
                  description: >-
                    Port the portal reverse-proxies on the per-session Service —
                    the in-pod Selkies (websockets viewer) HTTP/WebSocket port.
                viewer:
                  type: string
                  description: >-
                    Denormalized from the template (websockets/vnc) so the portal
                    knows which relay to open.
                sshHost:
                  type: string
                sshPort:
                  type: integer
  scope: Namespaced
  names:
    plural: sessions
    singular: session
    kind: Session
    shortNames:
    - ses

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                publicKeys:
                  type: array
                  items:
                    type: string
                admin:
                  type: boolean
                  default: false
                  description: >-
                    Grants portal admin rights (template/user/session management
                    across all users). Only an existing admin can set this.
                uid:
                  type: integer
                  description: >-
                    POSIX uid injected into VM sessions via cloud-init; falls
                    back to securityContext.runAsUser, then 1000.
                securityContext:
                  type: object
                  properties:
                    runAsUser:
                      type: integer
                    runAsGroup:
                      type: integer
                    fsGroup:
                      type: integer
                allowedGpuTypes:
                  type: array
                  items:
                    type: string
                  description: >-
                    Allow-list of gpuTypes this user may request on a template.
                    Omitted/empty means no restriction.
                allowedVolumes:
                  type: array
                  items:
                    type: string
                  description: >-
                    Allow-list of the volumes catalog this user's templates may
                    request. Omitted/empty means no restriction.
                allowedZones:
                  type: array
                  items:
                    type: string
                  description: >-
                    Allow-list of network zones this user's sessions may
                    explicitly request (template-baked or via the zone
                    override). Omitted/empty means no restriction; the
                    implicit default zone is never gated.
                overrides:
                  type: object
                  description: >-
                    Which template values this user may override per-session via
                    the session CR's spec.overrides (see
                    whistler/config.py _apply_overrides).
                  properties:
                    resources:
                      type: boolean
                    gpuType:
                      type: boolean
                    gpuCount:
                      type: boolean
                    uidGid:
                      type: boolean
                    securityContext:
                      type: boolean
                    volumes:
                      type: boolean
                    zone:
                      type: boolean
  scope: Namespaced
  names:
    plural: users
    singular: user
    kind: User
    shortNames:
    - usr

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zones.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                egress:
                  type: object
                  properties:
                    allowCIDRs:
                      type: array
                      description: >-
                        Whitelist: each entry becomes an egress rule to that
                        CIDR; omit ports to allow all ports.
                      items:
                        type: object
                        properties:
                          cidr:
                            type: string
                          ports:
                            type: array
                            items:
                              type: object
                              properties:
                                port:
                                  type: integer
                                protocol:
                                  type: string
                                  enum: ["TCP", "UDP", "SCTP"]
                    blockCIDRs:
                      type: array
                      description: >-
                        Blacklist: allow 0.0.0.0/0 EXCEPT these CIDRs (the
                        operator emits the explicit complement — ipBlock.except
                        is silently ignored by several CNIs). Evaluated
                        independently of allowCIDRs (OR logic).
                      items:
                        type: string
                dns:
                  type: object
                  properties:
                    clusterOnly:
                      type: boolean
                      description: >-
                        Pin port-53 egress to the cluster resolver (CoreDNS).
                        External names still resolve via its upstream
                        forwarding, but pods can't tunnel to arbitrary
                        resolvers.
                    servers:
                      type: array
                      description: >-
                        Force specific resolver IPs: port-53 egress is pinned
                        to them AND the pod's resolv.conf (a VM guest's too,
                        via masquerade DHCP) points at them. Cluster-internal
                        names then only resolve if that server handles them.
                      items:
                        type: string
  scope: Namespaced
  names:
    plural: zones
    singular: zone
    kind: Zone
    shortNames:
    - zn
