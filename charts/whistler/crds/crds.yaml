---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: desktoptemplates.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                user:
                  type: string
                image:
                  type: string
                backend:
                  type: string
                  enum: ["pod", "vm"]
                description:
                  type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: string
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                volumes:
                  type: object
                  additionalProperties:
                    type: string
                personalMountPath:
                  type: string
                persistence:
                  type: string
                  enum: ["ephemeral", "persistent", "preemptible"]
                displayPort:
                  type: integer
                instancetype:
                  type: string
                protocol:
                  type: string
                  enum: ["vnc", "rdp"]
                connectionParams:
                  type: object
                  additionalProperties:
                    type: string
                fuse:
                  type: boolean
                  description: >-
                    Grant the desktop container access to /dev/fuse. Required by
                    images whose display server mounts a FUSE filesystem (e.g.
                    gnome-remote-desktop's clipboard). Implemented today by
                    running the container privileged; the least-privilege
                    alternative is a FUSE device plugin (see design/vdi.md).
                privileged:
                  type: boolean
                  description: >-
                    Run the desktop container with securityContext.privileged=true.
                    Required for images that run systemd as PID 1 (e.g. gnome-grd).
                    In production, pair with runtimeClassName: kata to restore
                    VM-level isolation without full VM image management.
                runtimeClassName:
                  type: string
                  description: >-
                    Kubernetes RuntimeClass for the desktop pod. Set to "kata" (or
                    another Kata Containers runtime) to run the privileged container
                    inside a lightweight VM, restoring host isolation without the
                    overhead of managing full VM disk images.
                rdpSecurity:
                  type: string
                  enum: ["any", "nla", "tls", "rdp", "vmconnect"]
                  description: >-
                    RDP security/authentication mode passed to guacd as the
                    ``security`` connection parameter. "any" lets guacd negotiate;
                    "nla" forces Network Level Authentication (required by
                    gnome-remote-desktop); "tls" forces TLS without NLA; "rdp"
                    uses classic RDP encryption. Overrides a ``security`` key in
                    connectionParams if both are set.
  scope: Namespaced
  names:
    plural: desktoptemplates
    singular: desktoptemplate
    kind: DesktopTemplate
    shortNames:
    - dt

