apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: templates.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                user:
                  type: string
                mode:
                  type: string
                  enum: ["ssh", "desktop"]
                  default: ssh
                  description: >-
                    Access type. "ssh" templates are reached over SSH (TUI or
                    direct shell); "desktop" templates expose a display server
                    consumed by the web portal via guacamole.
                runtime:
                  type: string
                  enum: ["container", "kata", "vm"]
                  default: container
                  description: >-
                    Execution backend. "container" is a plain pod; "kata" is a
                    pod pinned to the Kata RuntimeClass (lightweight VM isolation);
                    "vm" is a full KubeVirt VirtualMachine. Replaces the old
                    backend + runtimeClassName fields. The Kata RuntimeClass name
                    is operator-configured, not set here.
                image:
                  type: string
                displayName:
                  type: string
                description:
                  type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: string
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                volumes:
                  type: object
                  additionalProperties:
                    type: string
                personalMountPath:
                  type: string
                privileged:
                  type: boolean
                  description: >-
                    Run the container with securityContext.privileged=true.
                    Required for images that run systemd as PID 1 (e.g. gnome-grd).
                    In production this can force the Kata runtime (see operator
                    config whistler.security.forceKataForPrivileged).
                fuse:
                  type: boolean
                  description: >-
                    Grant the container access to /dev/fuse. Required by images
                    whose display server mounts a FUSE filesystem (e.g.
                    gnome-remote-desktop's clipboard). Implemented today by running
                    the container privileged.
                displayPort:
                  type: integer
                  description: Desktop-only. Port the display server listens on (ignored for ssh).
                protocol:
                  type: string
                  enum: ["vnc", "rdp"]
                  description: Desktop-only. Guacamole protocol used by the portal.
                connectionParams:
                  type: object
                  additionalProperties:
                    type: string
                  description: Desktop-only. Extra guacamole connection parameters.
                rdpSecurity:
                  type: string
                  enum: ["any", "nla", "tls", "rdp", "vmconnect"]
                  description: >-
                    Desktop-only. RDP security/authentication mode passed to guacd
                    as the ``security`` connection parameter. "nla" is required by
                    gnome-remote-desktop. Overrides a ``security`` key in
                    connectionParams if both are set.
                instancetype:
                  type: string
                  description: VM-only. KubeVirt instancetype name (e.g. "u1.medium").
                persistence:
                  type: string
                  enum: ["ephemeral", "persistent", "preemptible"]
                  default: ephemeral
  scope: Namespaced
  names:
    plural: templates
    singular: template
    kind: Template
    shortNames:
    - tpl

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                templateRef:
                  type: string
                user:
                  type: string
                preemptible:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                mode:
                  type: string
                  description: Denormalized from the referenced template.
                runtime:
                  type: string
                  description: >-
                    The coerced runtime actually built (container/kata/vm). Used by
                    the operator probe/delete logic so it need not re-resolve the
                    template.
                podName:
                  type: string
                vmiName:
                  type: string
                address:
                  type: string
                displayPort:
                  type: integer
                sshHost:
                  type: string
                sshPort:
                  type: integer
  scope: Namespaced
  names:
    plural: sessions
    singular: session
    kind: Session
    shortNames:
    - ses
