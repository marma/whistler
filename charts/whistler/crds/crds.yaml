apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: templates.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                user:
                  type: string
                mode:
                  type: string
                  enum: ["ssh", "desktop"]
                  default: ssh
                  description: >-
                    Access type. "ssh" templates are reached over SSH (TUI or
                    direct shell); "desktop" templates expose a display server
                    consumed by the web portal via guacamole.
                runtime:
                  type: string
                  enum: ["container", "kata", "vm"]
                  default: container
                  description: >-
                    Execution backend. "container" is a plain pod; "kata" is a
                    pod pinned to the Kata RuntimeClass (lightweight VM isolation);
                    "vm" is a full KubeVirt VirtualMachine. Replaces the old
                    backend + runtimeClassName fields. The Kata RuntimeClass name
                    is operator-configured, not set here.
                image:
                  type: string
                imageURL:
                  type: string
                  description: >-
                    VM-only. HTTP(S) URL of a qcow2/raw disk image imported by CDI
                    into a per-session root-disk PVC (via dataVolumeTemplates).
                    Mutually exclusive with image. Subject to the whistler.images.vm
                    allow-list; the image must ship cloud-init and a serial getty.
                rootDiskSize:
                  type: string
                  default: "20Gi"
                  description: >-
                    VM-only. Size of the CDI-imported root disk PVC (only used with
                    imageURL; containerDisk roots are ephemeral and unsized).
                homeDiskSize:
                  type: string
                  description: >-
                    VM-only. Size of the per-INSTANCE home disk — a PVC carrying a
                    disk.img, attached as a second virtio-blk disk and formatted
                    ext4 by the guest (design/storage.md). Per instance, not per
                    user: a home that followed a user would carry data between
                    zones, since zone membership changes on reboot. Every VM gets
                    one regardless of persistence — the claim is owner-referenced
                    to its Session, so it is reaped with the instance and kept
                    while it lives. Defaults to WHISTLER_HOME_DISK_SIZE (20Gi).
                displayName:
                  type: string
                description:
                  type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: string
                    hugePageSize:
                      type: string
                      description: >-
                        VM-only. Page size backing this guest's RAM
                        (domain.memory.hugepages.pageSize), overriding the
                        cluster default (whistler.hugePages.pageSize, 2Mi).
                        Hugepages are what keep VFIO's DMA pinning of a large
                        GPU guest inside virt-handler's 20s SyncVMI deadline.
                        Only 2Mi and 1Gi exist on x86_64; `memory` is
                        rounded UP to a whole number of pages, and the node
                        must have that many reserved or the VM never
                        schedules. Set to "" to opt this template out and run
                        it on 4KiB pages.
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                volumes:
                  type: object
                  additionalProperties:
                    type: string
                personalMountPath:
                  type: string
                privileged:
                  type: boolean
                  description: >-
                    Run the container with securityContext.privileged=true.
                    Required for images that run systemd as PID 1 (e.g. gnome-grd).
                    In production this can force the Kata runtime (see operator
                    config whistler.security.forceKataForPrivileged).
                fuse:
                  type: boolean
                  description: >-
                    Grant the container access to /dev/fuse. Required by images
                    whose display server mounts a FUSE filesystem (e.g.
                    gnome-remote-desktop's clipboard). Implemented today by running
                    the container privileged.
                displayPort:
                  type: integer
                  default: 8082
                  description: >-
                    Desktop-only. Port the streamer sidecar's Selkies (websockets
                    viewer) HTTP/WebSocket server listens on; the portal
                    reverse-proxies it (ignored for ssh). Defaults to 8082.
                viewer:
                  type: string
                  enum: ["websockets", "vnc"]
                  description: >-
                    Desktop-only. Display backend the portal uses. "websockets"
                    reverse-proxies the browser to a Selkies 2.x (pixelflux)
                    server on displayPort — the streamer sidecar for pods, or a
                    guest-run Selkies for VMs. "vnc" serves the portal's vendored
                    noVNC client over the KubeVirt VNC subresource (VM-only;
                    works for any guest, no agent needed). Default is computed by
                    the operator: "vnc" for runtime=vm, "websockets" otherwise.
                streamerImage:
                  type: string
                  description: >-
                    Desktop-only. Override the streamer sidecar image (the native
                    init sidecar owning Xvfb + PulseAudio + Selkies that every
                    desktop pod gets); defaults to the operator-configured
                    WHISTLER_STREAMER_IMAGE (whistler.streamer.image).
                streamerEnv:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Desktop-only. Extra env vars for the streamer sidecar, for
                    workload-dependent streaming knobs the sidecar cannot infer —
                    e.g. SELKIES_H264_STREAMING_MODE: "true" (required for GL
                    compositors like GNOME Shell) or SELKIES_RESOLUTION. For
                    runtime=vm + viewer=websockets these reach the guest's
                    baked-in streamer instead, written by cloud-init to
                    /etc/whistler/streamer.env.
                instancetype:
                  type: string
                  description: VM-only. KubeVirt instancetype name (e.g. "u1.medium").
                persistence:
                  type: string
                  enum: ["ephemeral", "persistent", "preemptible"]
                  default: ephemeral
                zone:
                  type: string
                  description: >-
                    Network zone (whistler.zones) sessions from this template
                    run under; omitted means "default". Must name a defined
                    zone — an unknown zone fails the session closed rather
                    than falling back. Applied as a pod label at build time,
                    so a zone change takes effect on the next session
                    start/reboot, never live.
  scope: Namespaced
  names:
    plural: templates
    singular: template
    kind: Template
    shortNames:
    - tpl

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                templateRef:
                  type: string
                user:
                  type: string
                preemptible:
                  type: boolean
                homeVolume:
                  type: string
                  description: >-
                    Which of the user's HomeVolumes to attach as $HOME
                    (runtime: vm only). Omit for the default: a home named
                    after this instance, created on first start, which is
                    exactly the pre-named-volumes behaviour. A volume is
                    attached to at most one RUNNING instance at a time —
                    ext4 is not a cluster filesystem — so starting a second
                    instance holding the same volume is refused with a
                    PolicyError naming the instance that has it. See
                    design/security.md, "Core model: the access matrix".
                overrides:
                  type: object
                  description: >-
                    Per-session requests to deviate from the template's baked
                    values. Each field is honored only if the owning user's
                    User CR `overrides` grants that group; requesting an
                    ungranted field is a hard PolicyError (see
                    KubeConfigManager._apply_overrides). gpuType and volumes
                    are additionally checked against allowedGpuTypes /
                    allowedVolumes, same as a template-baked value.
                  properties:
                    resources:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    gpuType:
                      type: string
                    gpuCount:
                      type: integer
                    uid:
                      type: integer
                    gid:
                      type: integer
                    securityContext:
                      type: object
                      properties:
                        fsGroup:
                          type: integer
                        runAsUser:
                          type: integer
                        runAsGroup:
                          type: integer
                    volumes:
                      type: object
                      additionalProperties:
                        type: string
                    zone:
                      type: string
                      description: >-
                        Network zone override (requires the "zone" grant;
                        further gated by the user's allowedZones). Takes
                        effect on the next session start/reboot.
                runOverrides:
                  type: object
                  description: >-
                    The overrides for the run that is currently starting, set
                    by the portal's start dialog and replaced (or removed) by
                    every start. Same fields, same grants and same checks as
                    `overrides` — the difference is lifetime: this slice
                    belongs to one run and does not change what the instance
                    starts with next time, whereas `overrides` is the
                    instance's own default. Present-and-empty is meaningful
                    ("this run: no overrides at all"); absent means the
                    defaults apply. See config.effective_session_overrides.
                  properties:
                    resources:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    gpuType:
                      type: string
                    gpuCount:
                      type: integer
                    uid:
                      type: integer
                    gid:
                      type: integer
                    securityContext:
                      type: object
                      properties:
                        fsGroup:
                          type: integer
                        runAsUser:
                          type: integer
                        runAsGroup:
                          type: integer
                    volumes:
                      type: object
                      additionalProperties:
                        type: string
                    zone:
                      type: string
                      description: >-
                        Network zone override (requires the "zone" grant;
                        further gated by the user's allowedZones). Takes
                        effect on the next session start/reboot.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: >-
                    Session lifecycle phase. Pending/Provisioning/Booting/Ready/
                    Stopping/Failed/Terminating for all runtimes; VM sessions
                    additionally use Importing (CDI is pulling the root disk
                    image) and Stopped (the VirtualMachine exists but is
                    halted). Stopping is set by the reconcile that acts on a
                    stop request and replaced by the phase timer's next probe;
                    Terminating means the CR itself is going away.
                statusMessage:
                  type: string
                  description: >-
                    Human-readable reason for the current phase — set to the
                    rejection text when a reconcile fails on policy (Failed),
                    cleared once a reconcile gets past policy.
                policyFailed:
                  type: boolean
                  description: >-
                    True when the last reconcile rejected the session on policy
                    (a terminal Failed the phase timer must NOT overwrite with a
                    probe result, since no workload was created to probe).
                mode:
                  type: string
                  description: Denormalized from the referenced template.
                runtime:
                  type: string
                  description: >-
                    The coerced runtime actually built (container/kata/vm). Used by
                    the operator probe/delete logic so it need not re-resolve the
                    template.
                podName:
                  type: string
                vmiName:
                  type: string
                address:
                  type: string
                displayPort:
                  type: integer
                  description: >-
                    Port the portal reverse-proxies on the per-session Service —
                    the in-pod Selkies (websockets viewer) HTTP/WebSocket port.
                viewer:
                  type: string
                  description: >-
                    Denormalized from the template (websockets/vnc) so the portal
                    knows which relay to open.
                sshHost:
                  type: string
                sshPort:
                  type: integer
  scope: Namespaced
  names:
    plural: sessions
    singular: session
    kind: Session
    shortNames:
    - ses

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                publicKeys:
                  type: array
                  items:
                    type: string
                admin:
                  type: boolean
                  default: false
                  description: >-
                    Grants portal admin rights (template/user/session management
                    across all users). Only an existing admin can set this.
                uid:
                  type: integer
                  description: >-
                    POSIX uid injected into VM sessions via cloud-init; falls
                    back to securityContext.runAsUser, then 1000.
                securityContext:
                  type: object
                  properties:
                    runAsUser:
                      type: integer
                    runAsGroup:
                      type: integer
                    fsGroup:
                      type: integer
                allowedGpuTypes:
                  type: array
                  items:
                    type: string
                  description: >-
                    Allow-list of gpuTypes this user may request on a template.
                    Every allow is explicit: omitted/empty grants NOTHING
                    here, and the effective list is the union with every Group
                    this user belongs to — so a user with no list of their own
                    may request exactly what their groups grant, and a user in
                    no group may request no GPU at all.
                volumeAccess:
                  type: object
                  description: >-
                    The access matrix: which volumes may be mounted in which
                    zones, and how. Keyed zone -> volume -> mode. An ABSENT
                    entry is NO ACCESS — this field has no defaults, the
                    same explicit-allow rule the allow-lists here follow. It
                    is still not an allow-list and must not be read as one:
                    a cell is (zone, volume, mode), not a name.
                    A user's effective access is the most permissive entry
                    across their own table and every group's, ordered
                    allowed > read-only > absent; joining a group is a
                    deliberate act that confers access. See
                    design/security.md, "Core model: the access matrix".
                    ENFORCED TODAY FOR HOME VOLUMES ONLY — dataset and
                    PVC-volume rows are recorded and shown but still governed
                    by allowedVolumes and the group volume grants, the same
                    way `clipboard` is a declared-but-unenforced channel.
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                      enum: ["allowed", "read-only"]
                allowedVolumes:
                  type: array
                  items:
                    type: string
                  description: >-
                    Allow-list of the volumes catalog this user's templates may
                    request, all read-write. Every allow is explicit:
                    omitted/empty grants NOTHING here, and the effective list
                    is the union with the volumes granted by every Group this
                    user belongs to (which may grant read-only access — a name
                    granted rw anywhere is mounted rw).
                allowedZones:
                  type: array
                  items:
                    type: string
                  description: >-
                    Allow-list of network zones this user's sessions may run
                    in. Every allow is explicit: omitted/empty grants NOTHING
                    here, and the effective list is the union with every Group
                    this user belongs to. This covers the zone a template
                    bakes in, the zone override, AND the implicit default — a
                    template with no zone lands in "default", so "default"
                    must be granted like any other. A user granted no zone can
                    start no session.
                entryPoints:
                  type: array
                  items:
                    type: string
                    enum: ["kiosk", "portal", "gateway"]
                  description: >-
                    Which doors into Whistler this user may use: the kiosk
                    surface, the management portal (and the viewer app's
                    ordinary pages), and the SSH gateway. Every allow is
                    explicit: omitted/empty is NO DOOR — the account cannot
                    sign in anywhere — and [kiosk] is the kiosk binding of
                    design/security.md, "Closing the fourth axis". Composed
                    like allowedZones, NOT like channels: the effective set is
                    the union with every Group this user belongs to, so a group
                    that grants `portal` widens a kiosk-bound member back out.
                    The operator seeds this on the bootstrap admin, and the
                    portal seeds it on users it creates, so an account made
                    the ordinary way is not born locked out.
                channels:
                  type: array
                  items:
                    type: string
                    enum: ["ssh", "relay", "terminal", "clipboard", "screenshots"]
                  description: >-
                    Access channels granted to this user, narrowing the zone's
                    ceiling (never widening it). Omitted/empty means no
                    narrowing of the user's own — but the effective set is the
                    UNION with every Group this user belongs to, so a group
                    grant bounds a user who has none (see
                    whistler/config.py get_user_channels).
                overrides:
                  type: object
                  description: >-
                    Which template values this user may override per-session via
                    the session CR's spec.overrides (see
                    whistler/config.py _apply_overrides). Unioned with the
                    grants of every Group this user belongs to.
                  properties:
                    resources:
                      type: boolean
                    gpuType:
                      type: boolean
                    gpuCount:
                      type: boolean
                    uidGid:
                      type: boolean
                    securityContext:
                      type: boolean
                    volumes:
                      type: boolean
                    zone:
                      type: boolean
  scope: Namespaced
  names:
    plural: users
    singular: user
    kind: User
    shortNames:
    - usr

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: groups.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: >-
                A set of users sharing a project's grants. Every field here is
                unioned with the member's own User CR fields and with every
                other group they belong to. Every allow is explicit, so a
                group is the only thing that can widen a member who has
                granted themselves nothing, and empty everywhere is access to
                nothing. Membership lives here and only here — there is no
                `groups` field on User — so a project is edited in one place.
                See design/security.md, "Group".
              properties:
                description:
                  type: string
                members:
                  type: array
                  items:
                    type: string
                  description: >-
                    User CR names. A name that matches no User is ignored (it
                    grants nothing), so a group may be written before its
                    members exist.
                volumeAccess:
                  type: object
                  description: >-
                    The access matrix: which volumes may be mounted in which
                    zones, and how. Keyed zone -> volume -> mode. An ABSENT
                    entry is NO ACCESS — this field has no defaults, the
                    same explicit-allow rule the allow-lists here follow. It
                    is still not an allow-list and must not be read as one:
                    a cell is (zone, volume, mode), not a name.
                    A user's effective access is the most permissive entry
                    across their own table and every group's, ordered
                    allowed > read-only > absent; joining a group is a
                    deliberate act that confers access. See
                    design/security.md, "Core model: the access matrix".
                    ENFORCED TODAY FOR HOME VOLUMES ONLY — dataset and
                    PVC-volume rows are recorded and shown but still governed
                    by allowedVolumes and the group volume grants, the same
                    way `clipboard` is a declared-but-unenforced channel.
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                      enum: ["allowed", "read-only"]
                volumes:
                  type: array
                  description: >-
                    Volumes from the catalog this group's members may mount,
                    with the access mode each member gets. This is the field
                    that carries weight: it is what a per-member NFS export
                    set will be rendered from once shared volumes land.
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name:
                        type: string
                      mode:
                        type: string
                        enum: ["rw", "ro", "none"]
                        default: rw
                        description: >-
                          The access every member gets by default. `none`
                          grants nothing to members at large — only the
                          people named in `access` reach the volume.
                      access:
                        type: object
                        additionalProperties:
                          type: string
                          enum: ["rw", "ro"]
                        description: >-
                          Per-member exceptions to `mode`, keyed by username.
                          A member listed here need not also be in `members`
                          — but a name in neither gets nothing.
                allowedZones:
                  type: array
                  items:
                    type: string
                  description: Zones members may request (unioned, see above).
                allowedGpuTypes:
                  type: array
                  items:
                    type: string
                  description: gpuTypes members may request (unioned).
                entryPoints:
                  type: array
                  items:
                    type: string
                    enum: ["kiosk", "portal", "gateway"]
                  description: >-
                    Entry points members may use (unioned with their own, see
                    above). A grant, so this WIDENS a member whose own list is
                    narrower — a group is not the place to bind someone to the
                    kiosk, only to say which doors a project's members need.
                channels:
                  type: array
                  items:
                    type: string
                    enum: ["ssh", "relay", "terminal", "clipboard", "screenshots"]
                  description: >-
                    Access channels granted to members, narrowing the zone's
                    ceiling. This is the third axis: "lab staff" and "visiting
                    researchers" meet in the same zone on the same instance
                    and must not get the same doors. Omitted means no
                    narrowing from this group; an empty list grants nothing
                    beyond the desktop stream.
                overrides:
                  type: object
                  description: >-
                    Per-session override grants for members, OR'd with their
                    own (see whistler/config.py _apply_overrides).
                  properties:
                    resources:
                      type: boolean
                    gpuType:
                      type: boolean
                    gpuCount:
                      type: boolean
                    uidGid:
                      type: boolean
                    securityContext:
                      type: boolean
                    volumes:
                      type: boolean
                    zone:
                      type: boolean
  scope: Namespaced
  names:
    plural: groups
    singular: group
    kind: Group
    shortNames:
    - grp

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zones.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                ssh:
                  type: string
                  enum: ["direct", "relay", "none"]
                  description: >-
                    How this zone treats interactive SSH (default: direct).
                    An inbound session is an egress channel the zone's
                    egress-only NetworkPolicies never see — a user with a
                    shell can scp anything out — so the gateway is the only
                    place that can constrain it. direct: full end-to-end SSH
                    (ProxyJump), scp/sftp/port-forwarding included. relay:
                    gateway-mediated PTY only — FRICTION, NOT A BOUNDARY,
                    since data can still be typed out through the terminal.
                    none: no SSH at all. NOTE that `none` closes SSH, not the
                    border: the session still has a desktop, a bidirectional
                    clipboard, the portal web terminal and screenshots, none
                    of which this field governs. Containment is the
                    conjunction of the data, the channels, the user's trust
                    and the endpoint they sit at — see design/security.md,
                    "The border has four axes".
                channels:
                  type: array
                  items:
                    type: string
                    enum: ["ssh", "relay", "terminal", "clipboard", "screenshots"]
                  description: >-
                    The zone's channel CEILING — the most any session here may
                    use. A ceiling, not a setting: a User/Group `channels`
                    grant narrows it and nothing widens it. Omitted means no
                    ceiling beyond the legacy `ssh` field, which is folded in
                    (direct -> ssh+relay, relay -> relay, none -> neither) so
                    zones written before this field keep their meaning. An
                    empty list is a real ceiling of nothing, not "unset" —
                    the desktop stream alone. See design/security.md,
                    "Access channels: the second axis".
                egress:
                  type: object
                  properties:
                    allowCIDRs:
                      type: array
                      description: >-
                        Whitelist: each entry becomes an egress rule to that
                        CIDR; omit ports to allow all ports.
                      items:
                        type: object
                        properties:
                          cidr:
                            type: string
                          ports:
                            type: array
                            items:
                              type: object
                              properties:
                                port:
                                  type: integer
                                protocol:
                                  type: string
                                  enum: ["TCP", "UDP", "SCTP"]
                    blockCIDRs:
                      type: array
                      description: >-
                        Blacklist: allow 0.0.0.0/0 EXCEPT these CIDRs (the
                        operator emits the explicit complement — ipBlock.except
                        is silently ignored by several CNIs). Evaluated
                        independently of allowCIDRs (OR logic).
                      items:
                        type: string
                dns:
                  type: object
                  properties:
                    clusterOnly:
                      type: boolean
                      description: >-
                        Pin port-53 egress to the cluster resolver (CoreDNS).
                        External names still resolve via its upstream
                        forwarding, but pods can't tunnel to arbitrary
                        resolvers.
                    servers:
                      type: array
                      description: >-
                        Force specific resolver IPs: port-53 egress is pinned
                        to them AND the pod's resolv.conf (a VM guest's too,
                        via masquerade DHCP) points at them. Cluster-internal
                        names then only resolve if that server handles them.
                      items:
                        type: string
  scope: Namespaced
  names:
    plural: zones
    singular: zone
    kind: Zone
    shortNames:
    - zn
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datasets.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["bucket"]
              properties:
                description:
                  type: string
                endpoint:
                  type: string
                  description: >-
                    The REAL S3 server, which only Whistler's proxy ever
                    talks to. Sessions are given the proxy's in-cluster
                    address instead and never learn this one. Omit for AWS
                    S3 proper. See design/storage.md, "Whistler runs the S3
                    proxy": a zone rule must bind to an address Whistler
                    owns, or it silently means something else when the
                    server moves.
                bucket:
                  type: string
                  description: The bucket on that endpoint. Required.
                prefix:
                  type: string
                  description: >-
                    Optional key prefix, so one bucket can carry several
                    datasets. The session sees the prefix as the root.
                region:
                  type: string
                provider:
                  type: string
                  description: >-
                    rclone's S3 provider name (AWS, Minio, Ceph, Other, ...).
                    Defaults to Other, which is right for most S3-compatible
                    servers.
                credentialsSecret:
                  type: string
                  description: >-
                    Secret holding the real bucket credential as
                    `accessKeyId` / `secretAccessKey`. Mounted into this
                    dataset's proxies and nowhere else, so it never reaches
                    a guest whose user has root. The portal creates and
                    updates this Secret for datasets made there; point it at
                    your own Secret to keep the credential out of Whistler's
                    hands entirely.
                readOnly:
                  type: boolean
                  description: >-
                    Ceiling, not a default: when true this dataset is
                    read-only for EVERYONE regardless of any rw grant, and
                    only its read-only proxy is ever started. Shared data is
                    read-mostly and S3 resolves concurrent writers as a
                    silent last-writer-wins, so this is the posture to
                    prefer. Without it, a dataset is writable by anyone
                    granted it.
  scope: Namespaced
  names:
    plural: datasets
    singular: dataset
    kind: Dataset
    shortNames:
    - dset
