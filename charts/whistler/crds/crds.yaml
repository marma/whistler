apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: homevolumes.whistler.martinmalmsten.net
spec:
  group: whistler.martinmalmsten.net
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                user:
                  type: string
                  description: >-
                    The owning user. A HomeVolume lives in that user's
                    namespace, beside the PVC it describes.
                size:
                  type: string
                  description: >-
                    Requested size, e.g. "20Gi". Applied when the backing PVC
                    is created and not afterwards — growing a home needs the
                    PVC expanded and then the filesystem grown inside the
                    guest, which is not automated.
                storageClassName:
                  type: string
                  description: >-
                    Optional. Must be a class that can back a block image;
                    the default class is used when omitted.
                description:
                  type: string
                pvcName:
                  type: string
                  description: >-
                    The backing claim. Normally derived as
                    "whistler-home-<name>" and left unset; it is written
                    explicitly when an existing per-instance home is adopted
                    into a named volume, because those claims are named after
                    the session that created them and renaming a bound PVC is
                    not possible.
      additionalPrinterColumns:
        - name: User
          type: string
          jsonPath: .spec.user
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Claim
          type: string
          jsonPath: .spec.pvcName
  scope: Namespaced
  names:
    plural: homevolumes
    singular: homevolume
    kind: HomeVolume
    shortNames:
    - hvol
