image:
  repository: ghcr.io/marma/whistler
  pullPolicy: IfNotPresent
  tag: "dev"

namespaceCreate: true


operator:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 1000m
      memory: 512Mi
  logLevel: ERROR

server:
  enabled: true
  replicaCount: 1
  service:
    type: NodePort
    port: 8022
    nodePort: 30022
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 2000m
      memory: 1Gi
  logLevel: ERROR

whistler:
  auth:
    allowAny: false
  users: []
    # - name: someuser
    #   publicKeys:
    #     - "ssh-rsa ..."
    #   securityContext:
    #     fsGroup: 1001
    #     runAsUser: 1001
    #     ...


  node_selectors:
    - name: GPU type
      key: accelerator
      values:
        - nvidia-tesla-p100
        - A100-SXM4-40GB
    - name: Node name
      key: kubernetes.io/hostname
      values:
        - node_1
        - node_2
  #volumes:
  #  - name: data
  #    persistentVolumeClaim:
  #      claimName: data-pvc

templates:
  small:
    description: "Small instance"
    image: "ubuntu:latest"
    resources:
      cpu: 500m
      memory: 2Gi

userVolume:
  accessMode: ReadWriteMany
  size: 10Gi
