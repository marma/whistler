# What the guest does when the virtual ACPI power button is pressed.
#
# That press is not an edge case here — it is the ordinary way a session
# stops. Halting the VM (the portal's stop button, the launcher's S key, an
# idle kiosk) makes KubeVirt press it and then destroy the domain when
# whistler.vm.shutdownGraceSeconds runs out. It is also where "Power off" in
# the desktop menu ends up. A guest that does not act on it is not merely
# slow to stop: it is killed outright every time, and $HOME — ext4 on a
# virtio-blk disk since design/storage.md — comes back needing journal
# recovery, having lost whatever was still in page cache.
#
# poweroff IS systemd's default. This file is here so that stays true by
# decision rather than by inheritance: it is one apt upgrade, one desktop
# component, or one Ubuntu default change away from becoming "ignore" or
# "suspend" (suspend being the worst of the three — the domain never exits,
# so the guest is destroyed at the end of the window with the filesystem
# still mounted). The remaining way to break it is a power manager taking a
# handle-power-key inhibitor, which logind honours and no setting here can
# override; this is a server image with no desktop, so nothing here takes one.
# test.sh presses the button for real and fails if the guest does not go down.
#
# It matters most on this image, not least: a devbase VM is where a long build
# or a running database is, and it is the one users reach for `sudo shutdown`
# and `reboot` on directly.
[Login]
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
