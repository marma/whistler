# Docker's networks get the MTU of the guest's uplink, read at each start
# (/usr/local/lib/whistler/docker-mtu). Stock dockerd makes them 1500, and on a
# cluster whose pod network is smaller (1450 under flannel VXLAN) a
# container's full-size packets are dropped on the way out.
#
# The `-` keeps a failure here from keeping dockerd down. To pin your own MTU
# in /etc/docker/daemon.json, delete this file and `systemctl daemon-reload`.
[Service]
ExecStartPre=-/usr/local/lib/whistler/docker-mtu
