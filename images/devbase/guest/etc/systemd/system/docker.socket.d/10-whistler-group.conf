# Who may talk to dockerd: the `sudo` group, not `docker`.
#
# Access to the Docker socket is root on this machine (`docker run -v /:/host`),
# so the honest group for it is the one that already means root. The session
# user is created by cloud-init in `sudo` with NOPASSWD (whistler/cloudinit.py),
# which makes this grant nothing they did not hold — it only spares them typing
# `sudo docker`. Doing it here rather than adding the user to `docker` keeps the
# per-session cloud-init (shared with the desktop images) out of it.
[Socket]
SocketGroup=sudo
