{% extends "base.html" %}
{% block title %}New Volume — Admin — Whistler{% endblock %}
{% block content %}

<h2 class="ui header">
  <i class="database icon"></i>
  <div class="content">New Volume</div>
</h2>

<div class="ui segment" style="max-width:520px">
  <form class="ui form" method="post" action="/admin/volumes?user={{ current_user }}">
    <div class="field">
      <label>Volume Name</label>
      <input name="name" type="text" required placeholder="shared-data"
             pattern="[a-z0-9][a-z0-9\-]*">
      <div class="ui pointing label">Logical name used in templates and user config.</div>
    </div>

    <div class="field">
      <label>PVC Name</label>
      <input name="pvc_name" type="text" required placeholder="shared-data-pvc">
      <div class="ui pointing label">Name of the PersistentVolumeClaim in the cluster.</div>
    </div>

    <div class="field">
      <label>Sub-path <span class="ui grey tiny label">optional</span></label>
      <input name="sub_path" type="text" placeholder="subdir">
      <div class="ui pointing label">Mount only a subdirectory of the PVC.</div>
    </div>

    <div class="ui divider"></div>
    <button type="submit" class="ui primary button"><i class="save icon"></i> Create Volume</button>
    <a href="/admin/volumes?user={{ current_user }}" class="ui button">Cancel</a>
  </form>
</div>

{% endblock %}
