; xrdp config for the Whistler base-rdp desktop image (Ubuntu 26.04, xrdp 0.10.x).
;
; Trimmed from the stock /etc/xrdp/xrdp.ini with two deliberate changes for the
; browser -> portal -> guacd -> xrdp display path:
;
;   1. Force a 24-bit X server (xserverbpp=24 in [Xorg]). This DISABLES the
;      RemoteFX / GFX graphics pipeline: RFX and the H.264/AVC444 GFX codecs
;      require the 32-bit GFX surface, so at 24bpp xrdp/xorgxrdp fall back to
;      plain bitmap updates (lossless RLE). guacd therefore receives lossless
;      frames and its PNG-only re-encode to the browser stays lossless end to
;      end. Color depth is the documented lever for this (it appears commented
;      as #xserverbpp=24 in the stock [Xvnc] section). max_bpp below caps the
;      negotiated depth so a client can never pull a 32bpp (RFX-capable) session.
;      See design/vdi.md.
;
;   2. Log to the container console (EnableConsole=true, EnableSyslog=false) so
;      the negotiated codec is visible via `kubectl logs` / `docker logs` -- the
;      container has no syslog daemon. INFO is enough: when a codec engages xrdp
;      logs it at INFO (e.g. `xrdp_caps_process_codecs: RemoteFX ...` followed by
;      `rfxcodec_encode_create: ...`). With xserverbpp=24 the 32bpp RFX surface
;      is never created, so those lines are absent and xrdp falls back to plain
;      (lossless) bitmap updates.

[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
certificate=
key_file=
ssl_protocols=TLSv1.2, TLSv1.3
autorun=
allow_channels=true
allow_multimon=true
bitmap_cache=true
; bitmap_compression is lossless RLE -- unrelated to RFX/JPEG, kept on.
bitmap_compression=true
bulk_compression=true
; cap at 24bpp too, so the client can never negotiate a 32bpp (RFX-capable) session.
max_bpp=24
new_cursors=true
use_fastpath=both

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=false
EnableConsole=true
ConsoleLevel=INFO

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true

[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
ip=127.0.0.1
port=-1
code=20
; Force 24-bit -> no RemoteFX/GFX; guacd gets lossless bitmap updates.
xserverbpp=24
