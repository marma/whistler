name: Build and Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-and-push-chart:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Update Chart.yaml with tag version
        run: |
          # Extract version from tag (e.g., v0.2.0 -> 0.2.0)
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "Updating Chart.yaml to version: $VERSION"
          
          # Update both version and appVersion in Chart.yaml
          yq eval ".version = \"$VERSION\"" -i charts/whistler/Chart.yaml
          yq eval ".appVersion = \"$VERSION\"" -i charts/whistler/Chart.yaml
          
          # Display updated Chart.yaml for verification
          cat charts/whistler/Chart.yaml
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Login to GHCR OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          # Chart.yaml already has correct version from previous step
          helm package charts/whistler
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Push Helm chart to GHCR
        run: |
          # Extract version from tag for package filename
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          PKG_NAME=whistler-${VERSION}.tgz
          
          echo "Pushing chart: ${PKG_NAME}"
          helm push ${PKG_NAME} oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        if: startsWith(github.ref, 'refs/tags/v')
